---
name: Sync docs to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync root README into docs
        run: make docs-readme-sync

      - name: Publish docs to wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          path: docs
          preprocess: true
          disable-empty-commits: true

  notify-failure:
    needs:
      - publish-wiki
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_JOB_RESULTS: "publish-wiki=${{ needs.publish-wiki.result }}"
        run: make python-tool ARGS=notify-discord
