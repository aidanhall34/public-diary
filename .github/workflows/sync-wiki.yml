---
name: Sync docs to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Sync root README into docs
        run: make docs-readme-sync

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Stage docs into wiki
        run: make docs-wiki-stage

      - name: Commit wiki changes
        working-directory: wiki
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          if git diff --quiet -- .; then
            echo "Wiki already up to date."
            exit 0
          fi
          git add .
          git commit -m "docs: sync repository docs"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" HEAD

  notify-failure:
    needs:
      - publish-wiki
    if: ${{ always() && (contains(needs.*.result, 'failure') ||
      contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          permission-contents: read

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          DISCORD_JOB_RESULTS: "publish-wiki=${{ needs.publish-wiki.result }}"
        run: make python-tool ARGS=notify-discord
