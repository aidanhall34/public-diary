---
name: Sync docs to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - docs/**
      - .github/workflows/sync-wiki.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: true

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout wiki
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: wiki

      - name: Sync root README into docs
        run: make docs-readme-sync

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Stage docs into wiki
        run: make docs-wiki-stage

      - name: Commit wiki changes
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- .; then
            echo "Wiki already up to date."
            exit 0
          fi
          git add .
          git commit -m "docs: sync repository docs"
          git push

  notify-failure:
    needs:
      - publish-wiki
    if: ${{ always() && (contains(needs.*.result, 'failure') ||
      contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_JOB_RESULTS: "publish-wiki=${{ needs.publish-wiki.result }}"
        run: make python-tool ARGS=notify-discord
