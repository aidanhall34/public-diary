---
name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - vault/**
      - config/**
      - dev/scripts/configure-quartz.mjs
      - .github/workflows/deploy-pages.yml
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
    outputs:
      should_publish: ${{ steps.vault-changes.outputs.should_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        if: ${{ env.ACT != 'true' && env.PAGES_ADMIN_TOKEN != '' }}
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_ADMIN_TOKEN }}
          enablement: true

      - name: Configure GitHub Pages
        if: ${{ env.ACT != 'true' && env.PAGES_ADMIN_TOKEN == '' }}
        uses: actions/configure-pages@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Node.js
        if: ${{ env.ACT == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Node.js with npm cache
        if: ${{ env.ACT != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install act system dependencies
        if: ${{ env.ACT == 'true' }}
        run: |
          apt-get update
          apt-get install -y rsync

      - name: Authenticate to Google Cloud
        if: >-
          ${{
            env.ACT != 'true' &&
            vars.GOOGLE_WORKSPACE_DELEGATION_ENABLED != 'true'
          }}
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s
          create_credentials_file: false

      - name: Authenticate to Google Cloud with Workspace delegation
        if: >-
          ${{
            env.ACT != 'true' &&
            vars.GOOGLE_WORKSPACE_DELEGATION_ENABLED == 'true' &&
            vars.GOOGLE_WORKSPACE_USER != ''
          }}
        id: auth_dwd
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s
          access_token_subject: ${{ vars.GOOGLE_WORKSPACE_USER }}
          create_credentials_file: false

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ vars.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token ||
            steps.auth_dwd.outputs.access_token || secrets.GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [vault]
          type = drive
          scope = drive.readonly
          token = {"access_token":"${GOOGLE_DRIVE_ACCESS_TOKEN}","token_type":"Bearer","expiry":"2099-01-01T00:00:00Z"}
          root_folder_id = ${GOOGLE_DRIVE_ROOT_FOLDER_ID}
          team_drive = ${GOOGLE_DRIVE_SHARED_DRIVE_ID}
          EOF

      - name: Pull latest vault contents
        env:
          GOOGLE_DRIVE_REMOTE: vault
          GOOGLE_DRIVE_PATH: ${{ vars.GOOGLE_DRIVE_PATH }}
        run: make notes-clone

      - name: Detect vault changes
        id: vault-changes
        run: |
          if git diff --quiet -- vault; then
            vault_changed=false
          else
            vault_changed=true
          fi

          should_publish=true
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] && [ "${vault_changed}" = "false" ]; then
            should_publish=false
          fi

          {
            echo "vault_changed=${vault_changed}"
            echo "should_publish=${should_publish}"
          } >> "${GITHUB_OUTPUT}"

          if [ "${should_publish}" = "false" ]; then
            echo "No vault changes detected on scheduled run; skipping build and publish."
          fi

      - name: Build site
        if: steps.vault-changes.outputs.should_publish == 'true'
        run: make quartz-build

      - name: Report synced vault changes
        if: >-
          steps.vault-changes.outputs.should_publish == 'true' &&
          steps.vault-changes.outputs.vault_changed == 'true'
        run: echo "Vault changed in the workflow workspace; direct pushes to main are blocked by branch rules."

      - name: Upload GitHub Pages artifact
        if: >-
          steps.vault-changes.outputs.should_publish == 'true' && env.ACT !=
          'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    needs:
      - build
      - deploy
    if: ${{ always() && (contains(needs.*.result, 'failure') ||
      contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_JOB_RESULTS: "build=${{ needs.build.result }}, deploy=${{ needs.deploy.result }}"
        run: make python-tool ARGS=notify-discord
