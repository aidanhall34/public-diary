---
name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Authenticate to Google Cloud
        if: ${{ env.ACT != 'true' }}
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          access_token_lifetime: 3600s
          access_token_subject: ${{ vars.GOOGLE_WORKSPACE_USER }}
          create_credentials_file: false

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_DRIVE_SHARED_DRIVE_ID: ${{ vars.GOOGLE_DRIVE_SHARED_DRIVE_ID }}
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token || secrets.GOOGLE_DRIVE_ACCESS_TOKEN }}
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [vault]
          type = drive
          scope = drive.readonly
          token = {"access_token":"${GOOGLE_DRIVE_ACCESS_TOKEN}","token_type":"Bearer","expiry":"2099-01-01T00:00:00Z"}
          root_folder_id = ${GOOGLE_DRIVE_ROOT_FOLDER_ID}
          team_drive = ${GOOGLE_DRIVE_SHARED_DRIVE_ID}
          EOF

      - name: Build site
        env:
          GOOGLE_DRIVE_REMOTE: vault
          GOOGLE_DRIVE_PATH: ${{ vars.GOOGLE_DRIVE_PATH }}
        run: make build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-failure:
    needs:
      - build
      - deploy
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_JOB_RESULTS: "build=${{ needs.build.result }}, deploy=${{ needs.deploy.result }}"
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          UV_CACHE_DIR=/tmp/uv-cache uv sync --all-groups
          PYTHONPATH=dev/scripts uv run python -m public_diary_tools.cli notify-discord
