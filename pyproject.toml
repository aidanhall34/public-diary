[project]
name = "public-diary"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "google-api-python-client>=2.194.0",
    "google-auth>=2.49.2",
    "google-auth-oauthlib>=1.3.1",
    "pygithub>=2.9.1",
    "pynacl>=1.6.2",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "lxml>=6.1.0",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-requests>=2.33.0.20260408",
    "yamllint>=1.38.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["B", "BLE", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = ["dev/scripts"]
files = ["dev/scripts/public_diary_tools"]

[[tool.mypy.overrides]]
module = [
    "google.*",
    "googleapiclient.*",
    "github.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["dev/scripts"]
testpaths = ["dev/scripts/public_diary_tools/tests"]
addopts = "--cov=public_diary_tools --cov-report=term-missing --cov-report=html:dev/scripts/test_out/htmlcov --cov-report=json:dev/scripts/test_out/coverage.json --cov-fail-under=95"

[tool.coverage.run]
omit = [
    "dev/scripts/public_diary_tools/clients.py",
]
